<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/card-style.css">
</head>

<body>
  <main class="stage">
    <!-- Envelope -->
    <div class="cover" id="cover">
      <div class="envelope" id="envelope" role="button" tabindex="0">
        <div class="env-back"></div>
        <div class="paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal"></div>
      </div>

      <div class="caption" id="caption">
        <p class="addressed" id="addressed"></p>

        <!-- Code lock -->
        <form class="lock" id="lockForm" novalidate>
          <p class="lock-prompt">Decipher this to break the seal.</p>
          <p class="cipher" id="cipher"></p>
          <div class="code-boxes" id="codeBoxes"></div>
          <p class="lock-hint" id="lockHint"></p>
          <span class="lock-msg" id="lockMsg"></span>
          <button type="submit" class="unlock-btn" id="unlockBtn">Unlock</button>
        </form>

        <p class="tap-hint" id="tapHint">Tap the seal to open</p>
      </div>
    </div>

    <!-- Letter -->
    <article class="letter" id="letter">
      <div class="ornament">&#10022;</div>
      <p class="letter-date" id="letterDate"></p>
      <h1 class="letter-greeting" id="letterGreeting"></h1>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-closing" id="letterClosing"></p>
      <p class="letter-signature" id="letterSender"></p>
      <button type="button" class="close-btn" id="closeBtn">Close Letter</button>
    </article>

  </main>

  <script src="js/card-script.js"></script>
</body>
</html>
